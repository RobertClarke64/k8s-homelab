cyberchef:
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: cyberchef.robertclarke.co.uk
        paths:
          - path: /
            pathType: ImplementationSpecific
      - host: cyberchef.k8s.robertclarke.co.uk
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - cyberchef.robertclarke.co.uk
        secretName: cyberchef-tls
