{{- range $service := .Values.proxy.services }}
{{- if ($service.tlsPolicy).enabled }}
---
apiVersion: gateway.networking.k8s.io/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: {{ $service.name }}-config-policy
spec:
  targetRefs:
    - kind: Service
      name: {{ $service.name }}
      group: ""
  tls:
    insecureSkipVerify: true
{{- end }}
{{- end }}
