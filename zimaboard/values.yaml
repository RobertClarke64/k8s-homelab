nfs:
  server: 192.168.1.101
  # Use direct disk path instead of user share to avoid stale NFS handles
  # User shares (shfs) can invalidate file handles during disk operations
  path: /mnt/disk2/k8s-pv  # Or /mnt/cache/k8s-pv if using cache
  mountOptions:
    - hard
    - nfsvers=4.1
    - noresvport
    - softreval
    - timeo=600
    - retrans=3
    - lookupcache=none
    - actimeo=0
    - noatime

storageClasses:
  - create: true
    name: unraid-nfs-named
    defaultClass: true
    reclaimPolicy: Retain
    accessModes: ReadWriteOnce
    allowVolumeExpansion: true
    archiveOnDelete: false
    provisionerName: nfs.csi.k8s.io
    subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
