global:
  env: {}

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/seanmorley15/adventurelog-frontend
    pullPolicy: IfNotPresent
    tag: "v0.9.0"

  env:
    - name: PUBLIC_SERVER_URL
      value: "http://adventurelog-backend:8000"
    - name: ORIGIN
      value: "https://adventures.robertclarke.co.uk"
    - name: BODY_SIZE_LIMIT
      value: "Infinity"

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 3000

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/seanmorley15/adventurelog-backend
    pullPolicy: IfNotPresent
    tag: "v0.9.0"

  env:
    - name: PGHOST
      value: "adventurelog-db"
    - name: PGDATABASE
      value: "database"
    - name: PGUSER
      value: "adventure"
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: adventurelog-secret
          key: adventure-postgres-password
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: adventurelog-secret
          key: adventure-postgres-password
    - name: PUBLIC_URL
      value: "https://adventures.robertclarke.co.uk" # Match the outward port, used for the creation of image urls
    - name: FRONTEND_URL
      value: "https://adventures.robertclarke.co.uk"
    - name: CSRF_TRUSTED_ORIGINS
      value: "https://adventures.robertclarke.co.uk, http://localhost:3000"
    - name: DJANGO_ADMIN_USERNAME
      value: "admin"
    - name: DJANGO_ADMIN_PASSWORD
      value: "admin"
    - name: DJANGO_ADMIN_EMAIL
      value: "admin@example.com"
    - name: DEBUG
      value: "True"

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 8000

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  persistentVolume:
    create: true
    name: "adventurelog-backend-pv"
    storageClass: "unraid-nfs"
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 10Gi

  volumes:
    - name: backend-data-pv
      persistentVolumeClaim:
        claimName: adventurelog-backend-pv

  volumeMounts:
    - name: backend-data-pv
      mountPath: "/code/media"
  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}
  tolerations: []
  affinity: {}
db:
  replicaCount: 1
  image:
    repository: postgis/postgis
    pullPolicy: IfNotPresent
    tag: "15-3.3"

  env:
    - name: POSTGRES_DB
      value: database
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata/subdir
    - name: POSTGRES_USER
      value: adventure
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: adventurelog-secret
          key: adventure-postgres-password

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 5432

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  persistentVolume:
    create: true
    name: "adventurelog-db-pv"
    storageClass: "unraid-nfs"
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 10Gi

  volumes:
    - name: db-data-pv
      persistentVolumeClaim:
        claimName: adventurelog-db-pv

  volumeMounts:
    - name: db-data-pv
      mountPath: "/var/lib/postgresql/data"

  nodeSelector: {}
  tolerations: []
  affinity: {}
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""


ingress:
  enabled: true
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: adventures.robertclarke.co.uk
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

