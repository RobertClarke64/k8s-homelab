ingress-nginx:
  controller:
    loadBalancerIP: 192.168.1.241
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
      enable-brotli: true
      brotli-types: "text/css text/plain text/xml text/x-component text/javascript application/x-javascript application/javascript application/json application/manifest+json application/vnd.api+json application/xml application/xhtml+xml application/rss+xml application/atom+xml application/vnd.ms-fontobject application/x-font-ttf application/x-font-opentype application/x-font-truetype image/svg+xml image/x-icon image/vnd.microsoft.icon font/ttf font/eot font/otf font/opentype"
      brotli-level: 6
      use-forwarded-headers: "true"
      http-snippet: |
        more_set_headers -a "X-Robots-Tag: noai";
        more_set_headers -a "X-Robots-Tag: Google-Extended: none";
        more_set_headers -a "X-Robots-Tag: GPTBot: none";
        more_set_headers -a "X-Robots-Tag: ChatGPT-User: none";
        more_set_headers -a "X-Robots-Tag: anthropic-ai: none";
        more_set_headers -a "X-Robots-Tag: CCBot: none";
    service:
      externalTrafficPolicy: Local
