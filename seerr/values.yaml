seerr:
  config:
    persistence:
      storageClass: "unraid-nfs-named"

  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - name: seerr.robertclarke.co.uk
    tls:
      - secretName: seerr-tls
        hosts:
          - seerr.robertclarke.co.uk
