httpRoute:
  enabled: true
  parentRefs:
    - name: http
      namespace: kgateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - seerr.robertclarke.co.uk

seerr:
  config:
    persistence:
      storageClass: "unraid-nfs-named"

  probes:
    livenessProbe:
      initialDelaySeconds: 60
