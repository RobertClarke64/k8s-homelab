seerr:
  config:
    persistence:
      storageClass: "unraid-nfs-named"

  probes:
    livenessProbe:
      initialDelaySeconds: 60

  route:
    main:
      enabled: true
      parentRefs:
        - name: http
          namespace: kgateway-system
          sectionName: https
          group: gateway.networking.k8s.io
          kind: Gateway
      hostnames:
        - seerr.robertclarke.co.uk
