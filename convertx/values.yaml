applicationHost: convert.robertclarke.co.uk

controllers:
  convertx:
    enabled: true
    type: statefulset
    containers:
      convertx:
        image:
          repository: ghcr.io/c4illin/convertx
          tag: v0.15.1

        envFrom:
          - secretRef:
              name: "{{ .Release.Name }}"

    statefulset:
      volumeClaimTemplates:
        - name: data
          accessMode: ReadWriteOnce
          size: 10Gi
          globalMounts:
            - path: /app/data

secrets:
  convertx:
    enabled: true
    stringData:
      JWT_SECRET: "{{ default (randAlphaNum 48) .Values.jsonWebToken }}"

service:
  convertx:
    controller: convertx
    ports:
      http:
        port: 3000

ingress:
  convertx:
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    hosts:
      - host: "{{ .Values.applicationHost }}"
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: convertx
              port: http

