httpRoute:
  enabled: true
  parentRefs:
    - name: http
      namespace: kgateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - people.robertclarke.co.uk

monica:
  monica:
    host: people.robertclarke.co.uk
    extraEnv:
      - name: APP_URL
        value: "https://people.robertclarke.co.uk"
      - name: APP_TRUSTED_PROXIES
        value: "*"
    existingSecret:
      enabled: true
      secretName: monica
      mailUsernameKey: emailUsername
      mailPasswordKey: emailPassword
    mail:
      enabled: true
      fromAddress: monica@robertclarke.co.uk
      replyToAddress: monica@robertclarke.co.uk
      smtp:
        host: robertclarke.co.uk
        encryption: tls
        port: 587

  persistence:
    enabled: true
    storageClass: unraid-nfs-named

  internalDatabase:
    enabled: false

  externalDatabase:
    type: postgresql
    host: monica-cluster-rw
    database: app
    existingSecret:
      enabled: true
      secretName: monica-cluster-app
      usernameKey: username
      passwordKey: password

cluster:
  cluster:
    instances: 1
    storage:
      storageClass: unraid-nfs-named
