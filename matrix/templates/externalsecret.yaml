apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-email
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  refreshInterval: 10s

  target:
    name: matrix-email

  data:
    - secretKey: emailPassword
      remoteRef:
        key: /matrix/emailPassword
