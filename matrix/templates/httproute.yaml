apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "matrix.fullname" .Subcharts.matrix }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "A valid .Values.httpRoute.parentRefs entry is required when httpRoute.enabled is true" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.httpRoute.matrix.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
      backendRefs:
        - name: {{ include "matrix.fullname" .Subcharts.matrix }}
          port: {{ .Values.matrix.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /_synapse
      backendRefs:
        - name: {{ include "matrix.fullname" .Subcharts.matrix }}
          port: {{ .Values.matrix.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /.well_known/matrix
      backendRefs:
        - name: {{ include "matrix.fullname" .Subcharts.matrix }}
          port: {{ .Values.matrix.service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-element
  namespace: {{ .Release.Namespace }}
  labels:
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "A valid .Values.httpRoute.parentRefs entry is required when httpRoute.enabled is true" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.httpRoute.element.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: matrix-element
          port: 80
