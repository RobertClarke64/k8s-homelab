longhorn:
  defaultSettings:
    createDefaultDiskLabeledNodes: true
    taintToleration: "storageNode=true:NoSchedule"

  longhornManager:
    tolerations:
      - key: "storageNode"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

  ingress:
    enabled: true
    host: longhorn.robertclarke.co.uk
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/whitelist-source-range: "192.168.1.0/24"
    tls: true
    tlsSecret: longhorn-tls