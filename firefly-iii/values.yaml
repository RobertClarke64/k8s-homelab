firefly-iii-stack:
  firefly-db:
    storage:
      class: unraid-nfs
      accessModes: ReadWriteOnce
    backup:
      pvc:
        class: unraid-nfs

  firefly-iii:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - firefly.robertclarke.co.uk
      annotations:
        nginx.ingress.kubernetes.io/configuration-snippet: |
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Server $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $host;
    config:
      existingSecret: firefly-iii
      env:
        APP_URL: https://firefly.robertclarke.co.uk
        TRUSTED_PROXIES: "*"

  importer:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - importer.firefly.robertclarke.co.uk
