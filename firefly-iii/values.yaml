firefly-iii-stack:
  firefly-db:
    storage:
      class: unraid-nfs
      accessModes: ReadWriteOnce
    backup:
      pvc:
        class: unraid-nfs

  firefly-iii:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - firefly.robertclarke.co.uk
    config:
      existingSecret: firefly-iii
      env:
        APP_URL: https://firefly.robertclarke.co.uk
        TRUSTED_PROXIES: "*"

  importer:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - importer.firefly.robertclarke.co.uk
    fireflyiii:
      url: http://firefly-iii:80
      vanityUrl: https://firefly.robertclarke.co.uk
    config:
      existingSecret: firefly-iii-importer-env
