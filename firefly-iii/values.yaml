firefly-iii-stack:
  firefly-db:
    storage:
      class: unraid-nfs
      accessModes: ReadWriteOnce
    backup:
      pvc:
        class: unraid-nfs

  firefly-iii:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - firefly.robertclarke.co.uk
    config:
      existingSecret: firefly-iii

  importer:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - importer.firefly.robertclarke.co.uk
