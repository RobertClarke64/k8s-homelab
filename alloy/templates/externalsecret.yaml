apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alloy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  refreshInterval: 10s

  target:
    name: alloy

  data:
    - secretKey: CLICKSTACK_INGESTION_API_KEY
      remoteRef:
        key: /alloy/CLICKSTACK_INGESTION_API_KEY
