apiVersion: v1
kind: Service
metadata:
  name: {{ include "wanderer.db.fullname" . }}
  labels:
    {{- include "wanderer.db.labels" . | nindent 4 }}
spec:
  type: {{ .Values.db.service.type }}
  ports:
    - port: {{ .Values.db.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "wanderer.db.selectorLabels" . | nindent 4 }}
