apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-managed-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  refreshInterval: 10s

  target:
    name: rob-test-secret

  data:
    - secretKey: test-cat
      remoteRef:
        key: /test-secrets/cat