karakeep:
  applicationHost: keep.robertclarke.co.uk

  route:
    karakeep:
      enabled: true
      parentRefs:
        - name: http
          namespace: kgateway-system
          sectionName: https
          group: gateway.networking.k8s.io
          kind: Gateway
      hostnames:
        - "{{ .Values.applicationHost }}"
      rules:
        - backendRefs:
            - group: ""
              kind: Service
              name: karakeep
              port: 3000

  ingress:
    karakeep:
      enabled: false

  secrets:
    meilesearch:
      enabled: false
    karakeep:
      enabled: false

  controllers:
    karakeep:
      containers:
        karakeep:
          image:
            repository: ghcr.io/karakeep-app/karakeep
            tag: 0.33.2
          env:
            CRAWLER_FULL_PAGE_ARCHIVE: true
            CRAWLER_FULL_PAGE_SCREENSHOT: true
            CRAWLER_VIDEO_DOWNLOAD: true
            CRAWLER_VIDEO_DOWNLOAD_MAX_SIZE: 500
          envFrom:
            - secretRef:
                name: karakeep-secrets
      statefulset:
        volumeClaimTemplates:
          - name: data
            accessMode: ReadWriteOnce
            storageClass: unraid-nfs-named
            size: 2Gi
            globalMounts:
              - path: /data

    chrome:
      containers:
        chrome:
          chrome:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: release
          args:
            - --no-sandbox
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
            - --disable-blink-features=AutomationControlled
            - --window-size=1440,900
            - --headless

  meilisearch:
    persistence:
      storageClass: unraid-nfs-named
    auth:
      existingMasterKeySecret: karakeep-secrets
