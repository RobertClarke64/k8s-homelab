karakeep:
  applicationHost: keep.robertclarke.co.uk
  ingress:
    karakeep:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt"
      tls:
        - hosts:
            - "{{ .Values.applicationHost}}"
          secretName: karakeep-tls

  secrets:
    meilesearch:
      enabled: false
    karakeep:
      enabled: false

  controllers:
    karakeep:
      containers:
        karakeep:
          env:
            CRAWLER_FULL_PAGE_ARCHIVE: true
            CRAWLER_FULL_PAGE_SCREENSHOT: true
            CRAWLER_VIDEO_DOWNLOAD: true
            CRAWLER_VIDEO_DOWNLOAD_MAX_SIZE: 500
          envFrom:
            - secretRef:
                name: karakeep-secrets
      statefulset:
        volumeClaimTemplates:
          - name: data
            accessMode: ReadWriteOnce
            storageClass: unraid-nfs-named
            size: 2Gi
            globalMounts:
              - path: /data

    chrome:
      containers:
        chrome:
          args:
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --headless
            - --hide-scrollbars
            - --disable-gpu
            - --disable-dev-shm-usage
            - --no-sandbox
          securityContext:
            capabilities:
              add: ~

  meilisearch:
    persistence:
      storageClass: unraid-nfs-named
    auth:
      existingMasterKeySecret: karakeep-secrets
