dawarich:
  dawarich:
    replicaCount: 1
    hosts:
      - "map.robertclarke.co.uk"

  persistence:
    public:
      enabled: true
      storageClass: "unraid-nfs"
      size: 10Gi
    watched:
      enabled: true
      storageClass: "unraid-nfs"
      size: 10Gi
    storage:
      enabled: true
      storageClass: "unraid-nfs"
      size: 5Gi

  # This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    hosts:
      - host: map.robertclarke.co.uk
        paths:
          - path: /
            pathType: ImplementationSpecific

