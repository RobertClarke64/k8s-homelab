tandoor-recipes:
  route:
    main:
      enabled: true
      parentRefs:
        - name: http
          namespace: kgateway-system
          group: gateway.networking.k8s.io
          kind: Gateway
      hostnames:
        - recipes.robertclarke.co.uk

  persistence:
    media:
      storageClass: unraid-nfs-named

  workload:
    main:
      podSpec:
        containers:
          main:
            env:
              SECRET_KEY:
                secretKeyRef:
                  name: tandoor
                  key: SECRET_KEY
                  expandObjectName: false

  cnpg:
    main:
      cluster:
        storage:
          storageClass: unraid-nfs-named
        walStorage:
          storageClass: unraid-nfs-named
