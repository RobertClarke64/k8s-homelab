httpRoute:
  enabled: true
  service:
    name: tandoor-tandoor-recipes
    port: 10029
  parentRefs:
    - name: http
      namespace: kgateway-system
      sectionName: https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - recipes.robertclarke.co.uk

tandoor-recipes:

  persistence:
    media:
      storageClass: unraid-nfs-named

  workload:
    main:
      podSpec:
        containers:
          main:
            env:
              SECRET_KEY:
                secretKeyRef:
                  name: tandoor
                  key: SECRET_KEY
                  expandObjectName: false

  cnpg:
    main:
      cluster:
        storage:
          storageClass: unraid-nfs-named
        walStorage:
          storageClass: unraid-nfs-named
