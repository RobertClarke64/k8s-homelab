tandoor-recipes:
  ingress:
    main:
      enabled: true
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
        cert-manager.io/cluster-issuer: "letsencrypt"
      hosts:
        - host: tandoor.k8s.robertclarke.co.uk
        - host: recipes.robertclarke.co.uk
      tls:
        - hosts:
            - recipes.robertclarke.co.uk
          secretName: tandoor-recipes-tls

cluster-migration:
  mode: recovery
  recovery:
    method: pg_basebackup
    pgBaseBackup:
      source:
        host: tandoor-tandoor-recipes-cnpg-main-rw
        username: postgres
        database: recipes
        passwordSecret:
          name: tandoor-tandoor-recipes-cnpg-main-superuser
          key: "password"
