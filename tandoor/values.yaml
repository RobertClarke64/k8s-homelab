tandoor-recipes:
  persistence:
    media:
      storageClass: unraid-nfs-named
  ingress:
    main:
      enabled: true
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
        cert-manager.io/cluster-issuer: "letsencrypt"
      hosts:
        - host: tandoor.k8s.robertclarke.co.uk
        - host: recipes.robertclarke.co.uk
      tls:
        - hosts:
            - recipes.robertclarke.co.uk
          secretName: tandoor-recipes-tls

  workload:
    main:
      podSpec:
        containers:
          main:
            env:
              SECRET_KEY:
                secretKeyRef:
                  name: tandoor
                  key: SECRET_KEY
                  expandObjectName: false

  cnpg:
    main:
      cluster:
        storage:
          storageClass: unraid-nfs-named
        walStorage:
          storageClass: unraid-nfs-named
