global:
  domain: argo.robertclarke.co.uk

argo-cd:
  server:
    ingress:
      enabled: true
      hostname: argo.robertclarke.co.uk
      ingressClassName: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  repoServer:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  dex:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  redis:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  applicationSet:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  notifications:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

dashboards:
  argocd:
    url: "https://grafana.com/api/dashboards/14584/revisions/1/download"
  argocd-operational-overview:
    url: "https://grafana.com/api/dashboards/19993/revisions/4/download"
  argocd-notifications-overview:
    url: "https://grafana.com/api/dashboards/19975/revisions/4/download"
  argocd-application-overview:
    url: "https://grafana.com/api/dashboards/19974/revisions/4/download"
