global:
  domain: argo.robertclarke.co.uk

argo-cd:
  server:
    ingress:
      enabled: true
      hostname: argo.robertclarke.co.uk
      ingressClassName: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    metrics:
      serviceMonitor:
        enabled: true

  controller:
    metrics:
      serviceMonitor:
        enabled: true

  repoServer:
    metrics:
      serviceMonitor:
        enabled: true

  dex:
    metrics:
      serviceMonitor:
        enabled: true

  redis:
    metrics:
      serviceMonitor:
        enabled: true

  applicationSet:
    metrics:
      serviceMonitor:
        enabled: true

  notifications:
    metrics:
      serviceMonitor:
        enabled: true
