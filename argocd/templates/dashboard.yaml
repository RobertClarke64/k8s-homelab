{{ range $key, $value := .Values.dashboards }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $key }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folder: "ArgoCD"
  {{- if $value.url }}
  url: {{ $value.url }}
  {{- end }}
{{ end }}
