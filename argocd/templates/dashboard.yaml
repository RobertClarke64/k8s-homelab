{{ range $dashboard := .Values.dashboards }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $dashboard.name }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folder: "ArgoCD"
  {{- if $dashboard.url }}
  url: {{ $dashboard.url }}
  {{- end }}
{{ end }}
