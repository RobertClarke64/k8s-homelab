lubelogger:
  persistence:
    data:
      enabled: true
      storageClass: unraid-nfs-named

  secret:
    create: false
    name: lubelogger-email

  postgres:
    connect: true
    name: lubelogger-postgres
    keyRef: connectionString

cluster:
  cluster:
    instances: 1
    storage:
      storageClass: unraid-nfs-named
