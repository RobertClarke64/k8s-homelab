apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lubelogger-email
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  refreshInterval: 10s
  target:
    name: lubelogger-email
  data:
    - secretKey: MailConfig__EmailServer
      remoteRef:
        key: /lubelogger/emailServer
    - secretKey: MailConfig__EmailFrom
      remoteRef:
        key: /lubelogger/emailFrom
    - secretKey: MailConfig__Port
      remoteRef:
        key: /lubelogger/emailPort
    - secretKey: MailConfig__Username
      remoteRef:
        key: /lubelogger/emailUsername
    - secretKey: MailConfig__Password
      remoteRef:
        key: /lubelogger/emailPassword
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lubelogger-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  refreshInterval: 10s
  target:
    name: lubelogger-postgres
  data:
    - secretKey: POSTGRES_CONNECTION
      remoteRef:
        key: /lubelogger/postgresConnectionString
