apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-operator-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  refreshInterval: 10s

  target:
    name: grafana-operator-auth

  data:
    - secretKey: SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: /grafana/grafana-operator-auth-token