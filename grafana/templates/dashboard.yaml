apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ascode
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "my-dashboards"
  json: >
		{
			"annotations": {
				"list": [
					{
						"builtIn": 1,
						"datasource": {
							"type": "grafana",
							"uid": "-- Grafana --"
						},
						"enable": true,
						"hide": true,
						"iconColor": "rgba(0, 211, 255, 1)",
						"name": "Annotations & Alerts",
						"type": "dashboard"
					}
				]
			},
			"editable": true,
			"fiscalYearStartMonth": 0,
			"graphTooltip": 0,
			"id": 744,
			"links": [],
			"panels": [
				{
					"fieldConfig": {
						"defaults": {},
						"overrides": []
					},
					"gridPos": {
						"h": 8,
						"w": 12,
						"x": 0,
						"y": 0
					},
					"id": 1,
					"options": {
						"code": {
							"language": "plaintext",
							"showLineNumbers": false,
							"showMiniMap": false
						},
						"content": "# My Panel\n\nHello there",
						"mode": "markdown"
					},
					"pluginVersion": "12.1.1",
					"title": "My panel",
					"type": "text"
				}
			],
			"preload": false,
			"schemaVersion": 41,
			"tags": [],
			"templating": {
				"list": []
			},
			"time": {
				"from": "now-6h",
				"to": "now"
			},
			"timepicker": {},
			"timezone": "browser",
			"title": "test dashboard",
			"uid": "ad9248e1-62a3-41a9-9d5e-f1cc4f9d5543",
			"version": 1
		}
