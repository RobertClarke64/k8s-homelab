route:
  main:
    enabled: true
    parentRefs:
      - name: http
        namespace: kgateway-system
        sectionName: https
        group: gateway.networking.k8s.io
        kind: Gateway
    hostnames:
      - dvinyl.robertclarke.co.uk
    rules:
      - backendRefs:
          - identifier: main
            port: 3099

controllers:
  main:
    type: deployment
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 0
      surge: 1
    containers:
      main:
        image:
          repository: ghcr.io/kyonew/dvinyl
          tag: 3.1.0
          pullPolicy: IfNotPresent
        env:
          MONGODB_URL: mongodb://mongo:27017/dvinyl
          VINYL_PORT: 3099
          PROD: true

        envFrom:
          - secretRef:
              name: dvinyl

  mongo:
    type: statefulset
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 0
      surge: 1
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
    containers:
      mongo:
        image:
          repository: mongo
          tag: 4.4.18
          pullPolicy: IfNotPresent


service:
  main:
    controller: main
    ports:
      http:
        port: 3099
  mongo:
    controller: mongo
    ports:
      http:
        port: 27017

persistence:
  uploads:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: unraid-nfs-named
    advancedMounts:
      main:
        main:
          - path: /app/public/uploads
            readOnly: false
  mongo:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: unraid-nfs-named
    advancedMounts:
      mongo:
        mongo:
          - path: /data/db
            readOnly: false
