route:
  main:
    enabled: true
    parentRefs:
      - name: http
        namespace: kgateway-system
        sectionName: https-root-domain
        group: gateway.networking.k8s.io
        kind: Gateway
    hostnames:
      - robertclarke.co.uk

controllers:
  main:
    type: deployment
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 0
      surge: 1
    pod:
      imagePullSecrets:
        - name: ghcr-secret
    containers:
      main:
        image:
          repository: ghcr.io/robertclarke64/robertclarke.co.uk
          tag: sha-75c02b3
          pullPolicy: IfNotPresent

service:
  main:
    controller: main
    ports:
      http:
        port: 80
