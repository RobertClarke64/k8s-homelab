global:
  security:
    allowInsecureImages: true

linkwarden:
  image:
    tag: v2.13.0

  linkwarden:
    nextAuthSecret:
      existingSecret:
        name: linkwarden-auth
        key: token
    data:
      filesystem:
        pvc:
          size: 10Gi
          storageClass: unraid-nfs

  postgresql:
    image:
      repository: bitnamilegacy/postgresql

  ingress:
    enabled: true
    className: nginx
