apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: kgateway-system
spec:
  parentRefs:
    - name: http
      sectionName: http
  hostnames:
    - "*.robertclarke.co.uk"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
