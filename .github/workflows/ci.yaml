name: CI Pipeline
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
jobs:
  git-diff:
    name: Git diff Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get list of changed directories
        id: git-diff
        run: |
          git diff --name-only HEAD^..HEAD | cut -d/ -f1 | uniq
          echo "changed=\"$(git diff --name-only HEAD^..HEAD | cut -d/ -f1 | uniq | jq -Rc 'split(\" \")')\"" >> $GITHUB_OUTPUT
          echo "Changed files:"
          echo "${{ steps.git-diff.outputs.changed }}"
  
  helm-diff:
    name: Helm Diff Changes
    runs-on: ubuntu-latest
    needs: git-diff
    strategy:
      matrix:
        chart: ${{ fromJson(needs.git-diff.outputs.changed) }}
        exclude:
          - chart: ".github"
          - chart: ".gitignore"
          - chart: ".renovate.json"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Helm Diff
        uses: ./.github/actions/helm-diff
        with:
          helm-chart: ${{ matrix.chart }}
