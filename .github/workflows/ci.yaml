name: CI Pipeline
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
jobs:
  git-diff:
    name: Git Diff Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get list of changed directories
        id: git-diff
        run: |
          git diff --name-only HEAD^..HEAD | cut -d/ -f1 | uniq
          echo "changed=\"$(git diff --name-only HEAD^..HEAD | cut -d/ -f1 | uniq)\"" >> $GITHUB_OUTPUT

      - name: Display changed directories
        run: |
          echo "Changed files:"
          echo "${{ steps.git-diff.outputs.changed }}"
