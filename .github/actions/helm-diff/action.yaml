name: 'Helm Diff'
description: 'Diff Helm chart changes'
inputs:
  helm-chart:
    description: 'Helm chart to diff'
    required: true
runs:
  using: "composite"
  steps:
    - name: Install Helm
      uses: azure/setup-helm@v5.1.0
      id: install-helm
      with:
        version: 'v4.3.2'

    - name: Diff charts
      id: diff
      shell: bash
      run: make diff chart=${{ inputs.helm-chart }} base=HEAD^
