discordConfig:
  bridge:
    permissions:
      "*": relay
      "robertclarke.co.uk": user
      "@robertclarke64:robertclarke.co.uk": admin
    username_template: discord_{{.}}
    displayname_template: '{{if .Webhook}}Webhook{{else}}{{or .GlobalName .Username}}{{if .Bot}} (bot){{end}}{{end}}'
    channel_name_template: '{{if or (eq .Type 3) (eq .Type 4)}}{{.Name}}{{else}}#{{.Name}}{{end}}'
    guild_name_template: '{{.Name}}'
    command_prefix: '!discord'
    startup_private_channel_create_limit: 10
    management_room_text:
        welcome: "Hello, I'm a Discord bridge bot."
        welcome_connected: "Use `help` for help."
        welcome_unconnected: "Use `help` for help or `login` to log in."
        additional_help: ""
    encryption:
      allow: true
      default: true


    backfill:
      forward_limits:
        initial:
          dm: 50
          channel: 50
          thread: 50
        missed:
          dm: 50
          channel: 50
          thread: 50

controllers:
  mautrix-discord:
    enabled: true
    type: statefulset
    initContainers:
      merge-config:
        image:
          repository: mikefarah/yq
          tag: "4"
        command:
          - sh
          - -c
          - |
            yq eval-all '
              select(fileIndex == 0) * {"appservice": select(fileIndex == 1)}
            ' /base-config/config.yaml /registration/registration.yaml > /merged-config/config.yaml
    containers:
      mautrix-discord:
        image:
          repository: dock.mau.dev/mautrix/discord
          tag: "v0.7.5"

persistence:
  base-config:
    type: configMap
    name: matrix-bridges
    advancedMounts:
      mautrix-discord:
        merge-config:
          - path: /base-config
            readOnly: true
  registration:
    type: secret
    name: discord-registration
    advancedMounts:
      mautrix-discord:
        merge-config:
          - path: /registration
            readOnly: true
  merged-config:
    type: persistentVolumeClaim
    storageClass: unraid-nfs-named
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      mautrix-discord:
        merge-config:
          - path: /merged-config
        mautrix-discord:
          - path: /data

service:
  mautrix-discord:
    controller: mautrix-discord
    ports:
      http:
        port: 29334

configMaps:
  mautrix-discord:
    enabled: true
    data:
      config.yaml: |-
        {{- $baseValues := (.Files.Get "config/discord.yaml" | fromYaml) }}
        {{- $merged := mergeOverwrite dict $baseValues .Values.discordConfig }}
        {{- $merged | toYaml | nindent 2 }}

