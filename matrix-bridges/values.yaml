discordConfig: {}
whatsappConfig: {}

controllers:
  mautrix-discord:
    enabled: true
    type: statefulset
    initContainers:
      merge-config:
        image:
          repository: mikefarah/yq
          tag: "4"
        command:
          - sh
          - -c
          - |
            yq eval-all '
              select(fileIndex == 0) * {"appservice": select(fileIndex == 1)}
            ' /base-config/config.yaml /registration/registration.yaml > /merged-config/config.yaml
        securityContext:
          runAsUser: 99
          runAsGroup: 100
    containers:
      mautrix-discord:
        image:
          repository: dock.mau.dev/mautrix/discord
          tag: "v0.7.5"
        securityContext:
          runAsUser: 99
          runAsGroup: 100
        command:
          - "/usr/bin/mautrix-discord"
          - "--no-update"
          - "-c"
          - "/data/config.yaml"
          - "-r"
          - "/registration/registration.yaml"
        workingDir: /data
  mautrix-whatsapp:
    enabled: true
    type: statefulset
    initContainers:
      merge-config:
        image:
          repository: mikefarah/yq
          tag: "4"
        command:
          - sh
          - -c
          - |
            yq eval-all '
              select(fileIndex == 0) * {"appservice": select(fileIndex == 1)}
            ' /base-config/config.yaml /registration/registration.yaml > /merged-config/config.yaml
        securityContext:
          runAsUser: 99
          runAsGroup: 100
    containers:
      mautrix-whatsapp:
        image:
          repository: dock.mau.dev/mautrix/whatsapp
          tag: "v26.02"
        securityContext:
          runAsUser: 99
          runAsGroup: 100
        command:
          - "/usr/bin/mautrix-whatsapp"
          - "-c"
          - "/data/config.yaml"
          - "-r"
          - "/registration/registration.yaml"
        workingDir: /data

persistence:
  discord-base-config:
    type: configMap
    name: matrix-bridges-mautrix-discord
    advancedMounts:
      mautrix-discord:
        merge-config:
          - path: /base-config
            readOnly: true
  discord-registration:
    type: secret
    name: discord-registration
    advancedMounts:
      mautrix-discord:
        merge-config:
          - path: /registration
            readOnly: true
        mautrix-discord:
          - path: /registration
            readOnly: true
  discord-merged-config:
    type: persistentVolumeClaim
    storageClass: unraid-nfs-named
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      mautrix-discord:
        merge-config:
          - path: /merged-config
        mautrix-discord:
          - path: /data
  whatsapp-base-config:
    type: configMap
    name: matrix-bridges-mautrix-whatsapp
    advancedMounts:
      mautrix-whatsapp:
        merge-config:
          - path: /base-config
            readOnly: true
  whatsapp-registration:
    type: secret
    name: whatsapp-registration
    advancedMounts:
      mautrix-whatsapp:
        merge-config:
          - path: /registration
            readOnly: true
        mautrix-discord:
          - path: /registration
            readOnly: true
  whatsapp-merged-config:
    type: persistentVolumeClaim
    storageClass: unraid-nfs-named
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      mautrix-whatsapp:
        merge-config:
          - path: /merged-config
        mautrix-whatsapp:
          - path: /data

service:
  mautrix-discord:
    controller: mautrix-discord
    ports:
      http:
        port: 29334
  mautrix-whatsapp:
    controller: mautrix-whatsapp
    ports:
      http:
        port: 29318

configMaps:
  mautrix-discord:
    enabled: true
    data:
      config.yaml: |-
        {{- $baseValues := (.Files.Get "config/discord.yaml" | fromYaml) }}
        {{- $merged := mergeOverwrite dict $baseValues .Values.discordConfig }}
        {{- $merged | toYaml | nindent 2 }}
  mautrix-whatsapp:
    enabled: true
    data:
      config.yaml: |-
        {{- $baseValues := (.Files.Get "config/whatsapp.yaml" | fromYaml) }}
        {{- $merged := mergeOverwrite dict $baseValues .Values.whatsappConfig }}
        {{- $merged | toYaml | nindent 2 }}

