{{- if and .Values.pgvectors.persistentVolume.enabled .Values.pgvectors.persistentVolume.create -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.pgvectors.persistentVolume.name}}
spec:
  storageClassName: {{ .Values.pgvectors.persistentVolume.storageClass }}
  {{- with .Values.pgvectors.persistentVolume.accessModes }}
  accessModes:
    {{- toYaml . | nindent 4}}
  {{- end }}
  {{- with .Values.pgvectors.persistentVolume.resources }}
  resources:
    {{- toYaml . | nindent 4}}
  {{- end }}
{{- end }}