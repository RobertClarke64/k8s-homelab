immich:

  persistentVolume:
    create: true
    name: immich
    storageClass: unraid-nfs-named
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 300Gi

  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server # Line doesn't do anything except persuade renovate to update image tag automatically
            tag: v3.2.2
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-superuser
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-superuser
                  key: username
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-app
                  key: dbname
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-superuser
                  key: password
            IMMICH_LOG_LEVEL: debug
          probes:
            liveness:
              spec:
                timeoutSeconds: 5
            readiness:
              spec:
                timeoutSeconds: 5
            startup:
              spec:
                timeoutSeconds: 5

  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich

  valkey:
    enabled: true
    # Memory request == limit so the pod can never exceed its request, which puts it
    # at the bottom of the OOM-kill ranking. No CPU limit, to avoid throttling.
    controllers:
      main:
        containers:
          main:
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 256Mi
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: unraid-nfs-named
        size: 1Gi
        accessMode: ReadWriteOnce

  server:
    controllers:
      main:
        containers:
          main:
            resources:
              requests:
                cpu: 200m
                memory: 2Gi
              limits:
                memory: 2Gi

    route:
      main:
        enabled: true
        parentRefs:
          - name: http
            namespace: kgateway-system
            sectionName: https
            group: gateway.networking.k8s.io
            kind: Gateway
        hostnames:
          - photos.robertclarke.co.uk

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 99

  machine-learning:
    # Needs the most headroom: buffalo_l detection + recognition, CLIP and
    # PP-OCRv5 are all loaded into memory on the first job after an upload.
    controllers:
      main:
        containers:
          main:
            resources:
              requests:
                cpu: 200m
                memory: 3Gi
              limits:
                memory: 3Gi
    persistence:
      cache:
        type: persistentVolumeClaim
        storageClass: unraid-nfs-named
        size: 10Gi
        accessMode: ReadWriteMany

cluster:
  cluster:
    imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
    instances: 1
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 1Gi
    storage:
      storageClass: unraid-nfs-named
      size: 1Gi
    postgresql:
      shared_preload_libraries:
        - "vchord.so"
    initdb:
      postInitApplicationSQL:
        # Commands based on: https://immich.app/docs/administration/postgres-standalone/#without-superuser-permission
        - CREATE EXTENSION vchord CASCADE;
        - CREATE EXTENSION earthdistance CASCADE;
