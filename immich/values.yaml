immich:

  persistentVolume:
    create: true
    name: immich
    storageClass: unraid-nfs-named
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 300Gi

  controllers:
    main:
      containers:
        main:
          image:
            tag: v2.0.1
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-app
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-app
                  key: username
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-app
                  key: dbname
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-app
                  key: password

  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich

  valkey:
    enabled: true
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: unraid-nfs-named

  server:
    ingress:
      main:
        enabled: true
        ingressClassName: nginx
        annotations:
          # proxy-body-size is set to 0 to remove the body limit on file uploads
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - host: photos.k8s.robertclarke.co.uk
            paths:
              - path: "/"
          - host: photos.robertclarke.co.uk
            paths:
              - path: "/"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 99

  machine-learning:
    persistence:
      cache:
        type: persistentVolumeClaim
        storageClass: unraid-nfs

cluster:
  mode: recovery
  cluster:
    imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
    instances: 1
    storage:
      storageClass: unraid-nfs-named
      size: 1Gi
    postgresql:
      shared_preload_libraries:
        - "vchord.so"
    initdb:
      postInitApplicationSQL:
        # Commands based on: https://immich.app/docs/administration/postgres-standalone/#without-superuser-permission
        - CREATE EXTENSION vchord CASCADE;
        - CREATE EXTENSION earthdistance CASCADE;
  recovery:
    method: import
    import:
      type: microservice
      databases:
        - immich
      source:
        host: immich-pgvectors
        username: postgres
        passwordSecret:
          name: immich-pgvectors-pass
        database: immich

#### PGVECTORS CONFIG

replicaCount: 0

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: "ghcr.io/immich-app/postgres"
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "16-vectorchord0.3.0-pgvectors0.3.0"

environment:
  - name: POSTGRES_USER
    value: postgres
  - name: POSTGRES_PASSWORD
    value: postgres
  - name: POSTGRES_DB
    value: immich

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 99

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 5432

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# livenessProbe:
#   httpGet:
#     path: /
#     port: http
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

pgvectors:
  persistentVolume:
    enabled: true
    create: true
    name: postgresql-pvc
    storageClass: unraid-nfs
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi

volumes:
  - name: pgsql-storage
    persistentVolumeClaim:
      claimName: postgresql-pvc

volumeMounts:
  - name: pgsql-storage
    mountPath: "/var/lib/postgresql/data"
