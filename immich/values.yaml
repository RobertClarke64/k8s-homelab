immich:

  persistentVolume:
    create: true
    name: immich
    storageClass: unraid-nfs-named
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 300Gi

  controllers:
    main:
      containers:
        main:
          image:
            tag: v2.0.1
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-app
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-app
                  key: username
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-app
                  key: dbname
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-cluster-app
                  key: password

  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich

  valkey:
    enabled: true
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: unraid-nfs-named

  server:
    ingress:
      main:
        enabled: true
        ingressClassName: nginx
        annotations:
          # proxy-body-size is set to 0 to remove the body limit on file uploads
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - host: photos.k8s.robertclarke.co.uk
            paths:
              - path: "/"
          - host: photos.robertclarke.co.uk
            paths:
              - path: "/"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 99

  machine-learning:
    persistence:
      cache:
        type: persistentVolumeClaim
        storageClass: unraid-nfs

cluster:
  cluster:
    imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
    instances: 1
    storage:
      storageClass: unraid-nfs-named
      size: 1Gi
    postgresql:
      shared_preload_libraries:
        - "vchord.so"
    initdb:
      postInitApplicationSQL:
        # Commands based on: https://immich.app/docs/administration/postgres-standalone/#without-superuser-permission
        - CREATE EXTENSION vchord CASCADE;
        - CREATE EXTENSION earthdistance CASCADE;
