{{- if .Values.geopulse.serviceMonitor.enabled }}
{{- $fullName := include "geopulse.fullname" .Subcharts.geopulse -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullName }}
  labels:
    app: {{ $fullName }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullName }}
      app.kubernetes.io/component: backend
  endpoints:
  - port: http
    path: {{ .Values.geopulse.serviceMonitor.path }}
    interval: {{ .Values.geopulse.serviceMonitor.interval }}
{{- end }}
