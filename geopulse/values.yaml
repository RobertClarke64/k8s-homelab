# GeoPulse Helm Chart Values
# For detailed configuration information, see: https://github.com/tess1o/geopulse

# Global settings
global:
  # Image pull policy for all containers
  imagePullPolicy: IfNotPresent
  # Image pull secrets (if using private registry)
  imagePullSecrets: []
  # storageClass: ""

geopulse:
  postgres:
    enabled: false

  externalPostgres:
    host: "geopulse-cluster-rw"
    port: 5432
    database: app
    username: app
    password: ""

  keygen:
    
    persistence:
      enabled: true
      storageClass: "unraid-nfs-named"
      accessMode: ReadWriteOnce
      size: 10Mi

  # Application configuration
  config:
    uiUrl: "https://geopulse.robertclarke.co.uk"

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt"
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hostname: geopulse.robertclarke.co.uk
    tls:
      enabled: true
      secretName: geopulse-tls

  secrets:
    useExistingSecret: true
    existingSecretName: "geopulse-secrets"

cluster:
  cluster:
    instances: 1
    storage:
      storageClass: unraid-nfs-named
  type: postgis
